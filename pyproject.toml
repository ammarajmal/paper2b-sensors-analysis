[project]
name = "bridgedeck-vision-pipeline"
version = "0.1.0"
description = "Re-analysis of the 2025 wind-tunnel bridge-deck camera recordings (Paper 2A Sensors, Paper 2B Measurement, dissertation chapters) with gated, reproducible stages"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Ammar Ajmal" }]
dependencies = [
  "numpy>=2.2",
  "scipy>=1.15",
  "pandas>=2.2",
  "pyarrow>=19",
  "matplotlib>=3.10",
  "pyyaml>=6.0",
  "rosbags>=0.11",          # pure-Python ROS1 bag reader (no ROS install needed)
  "opencv-python-headless>=4.11",
  "pupil-apriltags>=1.0.4", # AprilTag tag36h11 detector (bundled C library; version gated in stage 2)
  "astropy>=7.0",           # LombScargle with false-alarm probability
  "statsmodels>=0.14",      # regression, bootstrap helpers
  "typer>=0.16",
  "rich>=14",
  "openpyxl>=3.1.5",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
bvp = "bridgedeck.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bridgedeck"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "E702", "B008", "B007", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
